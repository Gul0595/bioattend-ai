upstream backend  { server backend:8000; }
upstream frontend { server frontend:80; }

# ── Rate limit zones ─────────────────────────────────────────────────────────
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=60r/m;
limit_req_zone $binary_remote_addr zone=kiosk_limit:10m rate=120r/m;

server {
    listen 80;
    server_name _;

    client_max_body_size 20M;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript;

    # ── Security headers ──────────────────────────────────────────────────────
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header X-XSS-Protection "1; mode=block" always;

    # ── API routes ────────────────────────────────────────────────────────────
    location /api/ {
        limit_req zone=api_limit burst=30 nodelay;
        proxy_pass         http://backend;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }

    # ── Kiosk face-checkin (higher rate limit) ────────────────────────────────
    location /api/v1/attendance/face-checkin {
        limit_req zone=kiosk_limit burst=20 nodelay;
        proxy_pass       http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 60s;
    }

    # ── Prometheus metrics (restrict to internal) ─────────────────────────────
    location /metrics {
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny  all;
        proxy_pass http://backend;
    }

    # ── Storage files (face photos, reports) ─────────────────────────────────
    location /storage/ {
        proxy_pass http://backend/storage/;
        expires 7d;
        add_header Cache-Control "public";
    }

    # ── Health check ──────────────────────────────────────────────────────────
    location /health {
        proxy_pass http://backend/health;
        access_log off;
    }

    # ── Frontend SPA ─────────────────────────────────────────────────────────
    location / {
        proxy_pass       http://frontend;
        proxy_set_header Host $host;
    }
}
